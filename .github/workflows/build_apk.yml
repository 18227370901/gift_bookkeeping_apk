name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ccache \
            zip \
            unzip

      - name: Install Python Build Tools & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade "cython<3.0" "buildozer>=1.5.0" virtualenv

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiftBookkeeping-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Gift Bookkeeping App v1.0.0 (Latest Release)"
          body: |
            ### 📱 随礼记账安卓客户端 (Android APK)
            
            本版本由 GitHub Actions 自动化编译打包生成。
            
            - **文件格式**：`.apk`
            - **更新时间**：${{ github.event.head_commit.timestamp || 'Latest' }}
            - **提交信息**：${{ github.event.head_commit.message || 'Manual build' }}
            
            直接下载下方的 `.apk` 文件并在安卓手机上安装即可使用。
          files: bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



