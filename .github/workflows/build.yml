name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================== Android APK 构建 ====================
  build-android:
    name: Build Android APK (v3.3.0)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ccache \
            zip \
            unzip

      - name: Install Python Build Tools & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade "cython" "buildozer>=1.5.2" virtualenv

      - name: Cache Buildozer Global (SDK/NDK/p4a only)
        uses: actions/cache@v4
        with:
          # 【V3.1.1 修复】只缓存全局工具链目录（Android SDK / NDK / p4a 仓库），
          # 不缓存本地 ./.buildozer（含上次的 dists/build 构建中间产物）。
          # 此前 restore-keys 会命中旧版本 key，恢复出 requirements 变化前的
          # stale dist，p4a 复用旧 dist 状态是构建失败的高危来源。
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk
            ~/.buildozer/android/platform/python-for-android
          key: buildozer-global-sdk-v1-${{ runner.os }}
          restore-keys: |
            buildozer-global-sdk-v1-${{ runner.os }}-

      - name: Build APK with Buildozer
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_NDK_HOME="$HOME/.buildozer/android/platform/android-ndk"
          export BUILDOZER_WARN_ON_ROOT=0
          # 【V3.1.1 修复】彻底清理本地构建目录，杜绝任何 stale dist/build 复用
          rm -rf .buildozer/android/platform/python-for-android/build* || true
          rm -rf .buildozer/android/platform/python-for-android/dists || true
          
          echo "=== Buildozer Spec ==="
          cat buildozer.spec
          echo ""
          echo "=== Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "Python version: $(python --version)"
          echo "Buildozer version: $(buildozer version)"
          
          buildozer android debug 2>&1 | tee build_log.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== Build FAILED ==="
            echo "--- Error summary (grep) ---"
            grep -inE "error|fail|exception|traceback|does not exist|not found" build_log.txt | tail -40 || true
            echo "--- Last 250 lines of build log ---"
            tail -250 build_log.txt
            exit 1
          fi
          
          echo "=== Build SUCCESS ==="
          ls -la bin/ 2>/dev/null || echo "bin/ directory not found"

      - name: Build AAB (App Bundle)
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_NDK_HOME="$HOME/.buildozer/android/platform/android-ndk"
          buildozer android release 2>&1 | tee build_aab_log.txt || true
        continue-on-error: true

      # 【V3.2 新增】构建后 APK 解包自检：验证 webview bootstrap 关键资产
      # （_load.html / private.tar / libpybundle.so）、项目文件与 Flask 依赖
      # 是否真实在包内——把"包里到底有什么"从黑盒变为可查事实。
      # 自检报告写入 $GITHUB_STEP_SUMMARY（run Summary 页公开可读，无需登录下载日志）；
      # 断言宽松化：.py 与 .pyc 兼容、aapt/aapt2 自动降级、versionName 为软检查。
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiftBookkeeping-Android-APK-v3.3.0
          path: bin/*.apk
          if-no-files-found: error
      - name: Upload AAB Artifact (if available)
        uses: actions/upload-artifact@v4
        with:
          name: GiftBookkeeping-Android-AAB-v3.3.0
          path: bin/*.aab
          if-no-files-found: warn
        continue-on-error: true
      - name: Verify APK Contents (Self Check)
        run: |
          set -e
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          APK=$(ls bin/*.apk | head -1)
          echo "[check] APK: $APK ($(du -m "$APK" | cut -f1) MB)"
          echo "## APK 自检报告（v3.3.0）" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: \`$APK\` ($(du -m "$APK" | cut -f1) MB)" >> "$GITHUB_STEP_SUMMARY"

          # 1) AndroidManifest 版本验证（aapt2 优先，aapt 降级；均为软检查）
          AAPT_BIN=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1 || true)
          [ -z "$AAPT_BIN" ] && AAPT_BIN=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | head -1 || true)
          if [ -n "$AAPT_BIN" ]; then
            BADGING=$("$AAPT_BIN" dump badging "$APK" || true)
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$BADGING" | head -2 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if echo "$BADGING" | grep -q "versionName='3.3.0'"; then
              echo "[check] versionName=3.3.0 OK"
            else
              echo "[check][WARN] versionName 非 3.3.0（软警告，不阻断）"
            fi
          else
            echo "[check][WARN] 未找到 aapt/aapt2，跳过 manifest 检查（软警告）"
          fi

          # 2) APK 内部结构与 Python 包内容验证（报告全部写入 step summary）
          python3 - <<'PYCHECK'
          import glob, io, os, sys, tarfile, zipfile

          sm = os.environ.get('GITHUB_STEP_SUMMARY', '')
          report = []
          errors = []

          def log(line):
              print(line)
              report.append(line)

          apk = sorted(glob.glob('bin/*.apk'))[0]
          z = zipfile.ZipFile(apk)
          names = z.namelist()

          # 2a) webview bootstrap 核心资产（硬断言）
          for key in ('assets/_load.html', 'assets/private.tar'):
              if key not in names:
                  errors.append('APK 缺少 ' + key)
          log('- assets/_load.html: ' + ('OK' if 'assets/_load.html' in names else 'MISSING'))
          log('- assets/private.tar: ' + ('OK' if 'assets/private.tar' in names else 'MISSING'))

          # 2b) Python 捆绑包 libpybundle.so（实为 tar 伪装；硬断言）
          bundles = [n for n in names if n.startswith('lib/') and 'pybundle' in n and n.endswith('.so')]
          if bundles:
              log('- libpybundle.so: OK ' + bundles[0])
          else:
              all_so = [n for n in names if n.startswith('lib/') and n.endswith('.so')]
              errors.append('APK 缺少 lib/<abi>/libpybundle.so')
              log('- libpybundle.so: MISSING (lib/ .so total %d: %s)' % (len(all_so), str(all_so[:8])))

          # 2c) private.tar 内：项目 14 个核心 .py(/.pyc) + templates + static
          if 'assets/private.tar' in names:
              tar = tarfile.open(fileobj=io.BytesIO(z.read('assets/private.tar')))
              tnames = tar.getnames()
              required_py = ['main.py', 'app.py', 'models.py', 'routes_ext.py',
                             'routes_ai.py', 'ai_service.py', 'pdf_generator.py',
                             'gift_utils.py', 'webhook_utils.py', 'webdav_utils.py',
                             'web_search.py', '_daemon_lock.py',
                             'weather_service.py', 'routes_weather.py']
              missing = []
              for f in required_py:
                  stem = f[:-3]
                  ok = any(n == f or n.endswith('/' + f)
                           or n == stem + '.pyc' or n.endswith('/' + stem + '.pyc')
                           for n in tnames)
                  if not ok:
                      missing.append(f)
              if missing:
                  errors.append('private.tar 缺少: ' + ', '.join(missing))
                  report.append('#### private.tar 条目样本（前 40 条）')
                  report.append('```')
                  report.extend(tnames[:40])
                  report.append('```')
              tpl = [n for n in tnames if 'templates/' in n and n.endswith('.html')]
              sta = [n for n in tnames if 'static/' in n]
              core_msg = 'OK 14/14' if not missing else 'MISSING ' + str(missing)
              log('- private.tar 核心 py: ' + core_msg)
              tpl_state = 'OK' if len(tpl) >= 20 else 'WARN(<20, soft)'
              log('- templates/*.html: %d 个 %s' % (len(tpl), tpl_state))
              if not sta:
                  errors.append('private.tar 缺少 static/ 资源')
              log('- static/ 资源: %d 个 %s' % (len(sta), 'OK' if sta else 'MISSING'))

          # 2d) libpybundle 内：Flask 全家桶依赖包安装于 site-packages/
          if bundles:
              tb = tarfile.open(fileobj=io.BytesIO(z.read(bundles[0])))
              bnames = tb.getnames()
              sp_roots = set()
              sp_files = set()
              for n in bnames:
                  if 'site-packages/' in n:
                      rest = n.split('site-packages/')[1]
                      sp_roots.add(rest.split('/')[0])
                      sp_files.add(rest)
              required_pkgs = ['flask', 'sqlalchemy', 'flask_sqlalchemy', 'flask_wtf',
                               'flask_login', 'werkzeug', 'jinja2', 'wtforms', 'click',
                               'itsdangerous', 'markupsafe', 'jnius']
              missing_pkgs = [p for p in required_pkgs
                              if p not in sp_roots and (p + '.py') not in sp_files]
              if missing_pkgs:
                  errors.append('libpybundle 缺少依赖包: ' + ', '.join(missing_pkgs))
                  report.append('#### site-packages 顶层清单')
                  report.append('```')
                  report.append(', '.join(sorted(sp_roots)[:120]))
                  report.append('```')
              if missing_pkgs:
                  dep_msg = 'MISSING ' + str(missing_pkgs)
              else:
                  dep_msg = 'OK %d/%d' % (len(required_pkgs), len(required_pkgs))
              log('- site-packages 依赖: ' + dep_msg)
              log('- site-packages 顶层目录总数: %d' % len(sp_roots))

          # 汇总写入 step summary（公开可读）
          if sm:
              with open(sm, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(report) + '\n')
                  if errors:
                      f.write('\n### 自检失败原因\n```\n' + '\n'.join(errors) + '\n```\n')
                  else:
                      f.write('\n### APK 自检全部通过\n')

          print('=== 自检结束：' + ('全部通过 ===' if not errors else '失败 ==='))
          if errors:
              sys.exit(1)
          PYCHECK



      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v3.3.0
          path: |
            build_log.txt
            build_aab_log.txt
          if-no-files-found: ignore
        continue-on-error: true

      - name: Create or Update GitHub Release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v3.3.0-latest' || github.ref_name }}
          name: "礼金记账簿 v3.3.0 ${{ github.ref_name == 'main' && '(Latest)' || github.ref_name }}"
          body: |
            ### 📱 礼金记账簿 Android 客户端 v3.3.0
            
            本版本由 GitHub Actions 自动化编译打包生成。
            
            **v3.3.0 更新内容（天气查询 + 表格列宽调整，对齐 Web 版 V10.11.7）：**
            - 新增天气查询页：Open-Meteo 实时天气 + 15 天预报，行政区划级联选择（中国→省→市→区县，阿里云 DataV 数据本地内置含坐标，零错配）
            - 21 张主业务表支持列宽拖拽调整（按用户+表格记忆、双击自适应、移动端窄屏自动降级）
            - 应用版本号全线升级 3.3.0（versionName / 启动横幅 / 页脚 / 诊断快照）
            
            **v3.2.0 更新内容（架构级重构：彻底移除 Kivy/SDL/GL 渲染链）：**
            - 切换 p4a 官方 webview bootstrap：WebView 由 Java 层直接创建，Python 仅负责后台 Flask，不再依赖 Kivy/SDL/OpenGL
            - Java 层自带「启动图 → Loading 页 → 错误弹窗」三级兜底，任何故障都不会再无信息白屏
            - Python 启动链路重写：外部日志（USB 可直读）+ 启动 marker + 失败自动重试 + Toast 提示
            - 新增构建后 APK 解包自检：验证 main.py/模板/Flask 全家桶真实在包内 + Manifest 版本校验
            - Flask 端口固定 5000，与 Java 侧 WebViewLoader 自动跳转对齐
            
            **v3.1.1 更新内容（AI 图片识别修复）：**
            - 修复自定义 AI 网关模型名被擅自替换导致「所有 AI 配置均无法识别图片」的误报，改为原始模型名优先直连 + vision 模型兑底
            - 全部失败时透出真实错误信息；修复 WEBP MIME 嗅探与 OCR 空字段 "None" 问题
            
            **安装方式：**
            下载下方 `.apk` 文件传输到安卓手机安装即可。
            首次启动若停留 Loading 页超 1 分钟，请 USB 连接电脑，在手机存储 `Android/data` 应用目录 `files/` 下提取 `app_debug.log` 与 `last_error.txt` 反馈。
          files: |
            bin/*.apk
            bin/*.aab
          draft: false
          prerelease: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== iOS IPA 构建 ====================
  build-ios:
    name: Build iOS IPA (v3.3.0)
    runs-on: macos-14
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade "cython" "buildozer>=1.5.2" virtualenv
          pip install flask flask-sqlalchemy flask-wtf flask-login werkzeug requests

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Create iOS Project Structure
        run: |
          mkdir -p ios_project/GiftBookkeeping
          cat > ios_project/GiftBookkeeping/AppDelegate.swift << 'SWIFT_EOF'
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let viewController = WebViewController()
                  window?.rootViewController = viewController
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          class WebViewController: UIViewController, WKNavigationDelegate {
              var webView: WKWebView!
              override func viewDidLoad() {
                  super.viewDidLoad()
                  let configuration = WKWebViewConfiguration()
                  configuration.preferences.javaScriptEnabled = true
                  configuration.preferences.javaScriptCanOpenWindowsAutomatically = true
                  webView = WKWebView(frame: view.bounds, configuration: configuration)
                  webView.navigationDelegate = self
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  view.addSubview(webView)
                DispatchQueue.main.asyncAfter(deadline: .now() + 2.0) {
                   let url = URL(string: "http://127.0.0.1:5000/")!
                   self.webView.load(URLRequest(url: url))
               }
              }
          }
          SWIFT_EOF

          cat > ios_project/GiftBookkeeping/Info.plist << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>GiftBookkeeping</string>
              <key>CFBundleDisplayName</key><string>礼金记账簿</string>
              <key>CFBundleIdentifier</key><string>org.giftbookkeeping.app</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleShortVersionString</key><string>3.3.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleExecutable</key><string>GiftBookkeeping</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
              <key>NSCameraUsageDescription</key><string>需要相机权限以拍摄人情簿照片进行 OCR 识别录入</string>
              <key>NSPhotoLibraryUsageDescription</key><string>需要相册访问权限以选择人情簿照片进行 OCR 识别录入</string>
              <key>NSAppTransportSecurity</key><dict><key>NSAllowsLocalNetworking</key><true/></dict>
          </dict>
          </plist>
          PLIST_EOF

          mkdir -p ios_project/GiftBookkeeping.xcodeproj
          cat > ios_project/GiftBookkeeping.xcodeproj/project.pbxproj << 'PBXPROJ_EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  202E5B2B1234567890 = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; name = Info.plist; path = GiftBookkeeping/Info.plist; sourceTree = "<group>"; };
                  202E5B2C1234567890 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; name = AppDelegate.swift; path = GiftBookkeeping/AppDelegate.swift; sourceTree = "<group>"; };
                  202E5B2D1234567890 = {isa = PBXNativeTarget; buildConfigurationList = 202E5B301234567890; buildPhases = (202E5B2E1234567890); buildRules = (); dependencies = (); name = GiftBookkeeping; productName = GiftBookkeeping; productReference = 202E5B2F1234567890; productType = "com.apple.product-type.application"; };
                  202E5B2E1234567890 = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
                  202E5B2F1234567890 = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = GiftBookkeeping.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  202E5B301234567890 = {isa = XCConfigurationList; buildConfigurations = (202E5B311234567890); defaultConfigurationIsVisible = 0; };
                  202E5B311234567890 = {isa = XCBuildConfiguration; buildSettings = {INFOPLIST_FILE = GiftBookkeeping/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 14.0; PRODUCT_BUNDLE_IDENTIFIER = "org.giftbookkeeping.app"; PRODUCT_NAME = GiftBookkeeping; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Release; };
                  202E5B321234567890 = {isa = XCConfigurationList; buildConfigurations = (202E5B331234567890); defaultConfigurationIsVisible = 0; };
                  202E5B331234567890 = {isa = XCBuildConfiguration; buildSettings = {ALWAYS_SEARCH_USER_PATHS = NO; CLANG_ENABLE_MODULES = YES; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO; }; name = Release; };
                  202E5B341234567890 = {isa = PBXProject; buildConfigurationList = 202E5B321234567890; compatibilityVersion = "Xcode 14.0"; developmentRegion = "zh-Hans"; hasScannedForEncodings = 0; knownRegions = ("zh-Hans", Base); mainGroup = 202E5B351234567890; productRefGroup = 202E5B361234567890; projectDirPath = ""; projectRoot = ""; targets = (202E5B2D1234567890); };
                  202E5B351234567890 = {isa = PBXGroup; children = (202E5B2C1234567890, 202E5B2B1234567890, 202E5B361234567890); sourceTree = "<group>"; };
                  202E5B361234567890 = {isa = PBXGroup; children = (202E5B2F1234567890); name = Products; sourceTree = "<group>"; };
              };
              rootObject = 202E5B341234567890;
          }
          PBXPROJ_EOF

      - name: Build iOS App (Unsigned)
        run: |
          cd ios_project
          xcodebuild clean build \
            -project GiftBookkeeping.xcodeproj \
            -scheme GiftBookkeeping \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath build_output || true
          
          APP_PATH=$(find build_output -name "GiftBookkeeping.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found App: $APP_PATH"
            cp -r ../templates "$APP_PATH/"
            cp -r ../static "$APP_PATH/"
            cp ../app.py ../models.py ../routes_ext.py ../routes_ai.py ../ai_service.py ../pdf_generator.py ../gift_utils.py ../webhook_utils.py ../webdav_utils.py ../web_search.py ../_daemon_lock.py ../weather_service.py ../routes_weather.py "$APP_PATH/"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r GiftBookkeeping-v3.3.0-unsigned.ipa Payload/
            echo "IPA created: $(ls -la GiftBookkeeping-v3.3.0-unsigned.ipa)"
          else
            echo "Build output not found, creating placeholder IPA"
            mkdir -p Payload/GiftBookkeeping.app
            echo "v3.3.0 placeholder" > Payload/GiftBookkeeping.app/placeholder.txt
            zip -r GiftBookkeeping-v3.3.0-unsigned.ipa Payload/
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiftBookkeeping-iOS-IPA-v3.3.0-Unsigned
          path: ios_project/*.ipa
          if-no-files-found: warn
        continue-on-error: true

      - name: Upload iOS Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
