{% extends 'base.html' %}

{% block title %}修改密码 - 人情礼金记账系统{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-danger text-white text-center py-3">
                <h4 class="mb-0"><i class="fa-solid fa-lock me-2"></i>修改个人密码</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('change_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">原密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="old_password" name="old_password" placeholder="请输入原密码" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">新密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="请输入新密码" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认新密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="请再次确认新密码" required>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold mt-2"><i class="fa-solid fa-check me-1"></i>提交修改</button>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3">
                <a href="{{ url_for('index') }}" class="text-decoration-none text-secondary"><i class="fa-solid fa-arrow-left me-1"></i>返回账本</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
